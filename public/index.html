<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVI - Debrecen</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to a CSS file we'll create later -->
</head>
<body>
    <div class="container">
        <h1>Welcome to NAVI!</h1>
        <p>Your loyalty app for Debrecen.</p>

        <div id="user-info" style="margin-bottom: 1em;">
            <div id="user-status">
                <!-- Status will be updated by JS -->
                Checking login status...
            </div>
            <div id="user-points" style="display: none;">
                Points: <span id="points-balance">0</span>
            </div>
        </div>

        <hr>

        <div id="auth-forms">
            <!-- Forms will be hidden/shown by JS -->
            <h2>Sign Up</h2>
            <form id="signup-form">
                <input type="email" id="signup-email" name="email" placeholder="Email" required autocomplete="email">
                <input type="password" id="signup-password" name="password" placeholder="Password" required autocomplete="new-password">
                <button type="submit">Sign Up</button>
                <p id="signup-message"></p>
            </form>

            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" name="email" placeholder="Email" required autocomplete="username">
                <input type="password" id="login-password" name="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit">Login</button>
                <p id="login-message"></p>
            </form>
        </div>

        <div id="logout-section" style="display: none;">
            <button id="logout-button">Logout</button>
        </div>

        <hr>

        <div id="main-content" style="display: none;">
            <h2>Partners</h2>
            <div id="business-list">
                <!-- Business data will be loaded here by JS -->
                <p>Loading businesses...</p>
            </div>
            <!-- TODO: Add points display etc. -->
        </div>

        <!-- QR Code Modal Placeholder -->
        <div id="qr-code-modal" style="display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
            <div style="background-color: white; padding: 30px; border-radius: 8px; text-align: center; max-width: 90%; width: 350px;">
                <h2 style="margin-top: 0;">Show QR Code to Staff</h2>
                <p style="font-weight: bold; margin-bottom: 5px;">Reward:</p>
                <p id="qr-reward-description" style="margin-top: 0; margin-bottom: 15px; font-size: 1.1em;"></p>
                <canvas id="qr-code-canvas" style="max-width: 100%; height: auto;"></canvas> <!-- QR code will be drawn here -->
                <p><small id="qr-expiry-info" style="color: #dc3545;"></small></p>
                <button id="close-qr-modal" style="margin-top: 15px;">Close</button>
            </div>
        </div>

    </div> <!-- Close container -->

    <!-- QR Code Library (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1/build/qrcode.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
