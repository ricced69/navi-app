<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVI - Debrecen</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to a CSS file we'll create later -->
</head>
<body>
    <div class="container">
        <h1>Welcome to NAVI!</h1>
        <p>Your loyalty app for Debrecen.</p>

        <div id="user-info" style="margin-bottom: 1em;">
            <div id="user-status">
                <!-- Status will be updated by JS -->
                Checking login status...
            </div>
            <div id="user-points" style="display: none;">
                Points: <span id="points-balance">0</span>
            </div>
        </div>

        <hr>

        <div id="auth-forms">
            <!-- Forms will be hidden/shown by JS -->
            <h2>Sign Up</h2>
            <form id="signup-form">
                <input type="email" id="signup-email" name="email" placeholder="Email" required autocomplete="email">
                <input type="password" id="signup-password" name="password" placeholder="Password" required autocomplete="new-password">
                <button type="submit">Sign Up</button>
                <p id="signup-message"></p>
            </form>

            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" name="email" placeholder="Email" required autocomplete="username">
                <input type="password" id="login-password" name="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit">Login</button>
                <p id="login-message"></p>
            </form>
        </div>

        <div id="logout-section" style="display: none;">
            <button id="logout-button">Logout</button>
        </div>

        <hr>

        <div id="main-content" style="display: none;">
            <h2>Partners</h2>
            <div id="business-list">
                <!-- Business data will be loaded here by JS -->
                <p>Loading businesses...</p>
            </div>
            <!-- TODO: Add points display etc. -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
